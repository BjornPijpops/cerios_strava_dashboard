name: Sync and publish dashboard

on:
  schedule:
    - cron: "17 * * * *" # hourly
  workflow_dispatch:
  push:
    branches: [main]

# One run at a time: parallel runs would race on the rotating Strava refresh tokens.
concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to commit the re-encrypted (rotated) tokens to the `state` branch
    env:
      STATE_KEY: ${{ secrets.STATE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Check setup
        run: |
          if [ -z "$STATE_KEY" ]; then
            echo "::error::Secret STATE_KEY is missing. See docs/deployment.md, step 1."; exit 1
          fi
          if ! git ls-remote --exit-code --heads origin state > /dev/null; then
            echo "::error::Branch 'state' does not exist yet. Run 'npm run init-state' on your computer first (docs/deployment.md, step 2)."; exit 1
          fi

      - name: Check out encrypted state
        uses: actions/checkout@v7
        with:
          ref: state
          path: state-branch

      # Activities are rebuildable from Strava, so a cache is enough (a lost cache just triggers a re-sync).
      - name: Restore activity cache
        uses: actions/cache/restore@v6
        with:
          path: data/activities.json
          key: activities-${{ github.run_id }}
          restore-keys: activities-

      - name: Decrypt credentials and tokens
        run: node dist/cli.js state-decrypt state-branch/state.enc

      - name: Sync from Strava
        id: sync
        run: node dist/cli.js sync
        continue-on-error: true # one member without tokens must not block publishing the rest

      # Always persist, even after a partial failure: refresh tokens that already rotated are the only valid ones.
      - name: Save rotated tokens
        if: always()
        run: |
          git -C state-branch config user.name "strava-dashboard"
          git -C state-branch config user.email "noreply@users.noreply.github.com"
          for attempt in 1 2 3; do
            node dist/cli.js state-save state-branch/state.enc
            git -C state-branch add state.enc
            if git -C state-branch diff --cached --quiet; then exit 0; fi
            git -C state-branch commit -q -m "Rotate tokens"
            if git -C state-branch push -q origin state; then exit 0; fi
            # Someone (add-member) pushed meanwhile: take their file, state-save then merges our tokens into it.
            git -C state-branch fetch -q origin state && git -C state-branch reset -q --hard origin/state
          done
          echo "::error::Could not save the rotated tokens"; exit 1

      - name: Save activity cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: data/activities.json
          key: activities-${{ github.run_id }}

      - name: Build static site
        run: |
          node dist/cli.js export site/data
          cp public/index.html site/index.html
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Report sync problems
        if: steps.sync.outcome == 'failure'
        run: echo "::warning::Some members failed to sync, see the 'Sync from Strava' step."

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
