<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strava Challenge</title>
<style>
  :root {
    --brand: #212b46;
    --brand-light: #2d3a5e;
    --brand-soft: #e9ecf4;
    --accent: #fc4c02;
    --bg: #f3f5fa;
    --card: #fff;
    --text: #1a2036;
    --muted: #6b7390;
    --gold: #e8b923; --silver: #a8b0c0; --bronze: #c98a56;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); }

  header { background: linear-gradient(135deg, var(--brand) 0%, var(--brand-light) 100%); color: #fff; padding: 2rem 1.5rem 5.5rem; }
  .wrap { max-width: 1150px; margin: 0 auto; }
  header h1 { margin: 0; font-size: 1.9rem; letter-spacing: -.01em; }
  header h1 span { color: var(--accent); }
  .meta { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .9rem; }
  .pill { background: rgba(255,255,255,.12); border-radius: 999px; padding: .3rem .85rem; font-size: .82rem; }
  #quarter { background: var(--accent); color: #fff; border: 0; border-radius: 999px; padding: .3rem .8rem; font-size: .82rem; font-weight: 700; cursor: pointer; }
  #quarter option { color: #111; background: #fff; }

  main { max-width: 1150px; margin: -4rem auto 2rem; padding: 0 1rem; display: grid; gap: 1.1rem; grid-template-columns: repeat(2, 1fr); }
  .back[hidden] { display: none; }
  .toggle { margin-top: .6rem; background: var(--brand-soft); color: var(--brand); border: 0; border-radius: 8px; padding: .35rem .8rem; font-size: .8rem; font-weight: 600; cursor: pointer; }
  .toggle:hover { background: #dbe0ee; }
  .card { background: var(--card); border-radius: 16px; padding: 1.4rem; box-shadow: 0 4px 18px rgba(33,43,70,.08); border-top: 4px solid var(--brand); }
  .card h2 { margin: 0; font-size: 1.05rem; color: var(--brand); display: flex; align-items: center; gap: .5rem; }
  .card h2 .emoji { font-size: 1.3rem; }
  .muted { color: var(--muted); font-size: .85rem; }

  .hero { grid-column: 1 / -1; display: grid; grid-template-columns: auto 1fr; gap: 2rem; align-items: center; border-top-color: var(--accent); }
  .ring { position: relative; width: 190px; height: 190px; }
  .ring svg { transform: rotate(-90deg); }
  .ring .label { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ring .pct { font-size: 2.4rem; font-weight: 800; color: var(--brand); line-height: 1; }
  .hero .big { font-size: 2.6rem; font-weight: 800; color: var(--brand); margin: .3rem 0; }
  .hero .big small { font-size: 1.1rem; font-weight: 500; color: var(--muted); }
  .status { display: inline-block; margin-top: .6rem; padding: .25rem .8rem; border-radius: 999px; font-size: .82rem; font-weight: 600; }
  .status.ok { background: #e3f6ea; color: #17803d; } .status.behind { background: #fdeee6; color: #c2410c; }

  .total { font-size: 2.1rem; font-weight: 800; color: var(--brand); margin: .5rem 0 0; }
  .total small { font-size: 1rem; font-weight: 500; color: var(--muted); }

  ol { list-style: none; padding: 0; margin: 1rem 0 0; }
  li { display: grid; grid-template-columns: 2rem 1fr auto; align-items: center; gap: .5rem; padding: .45rem 0; border-top: 1px solid var(--brand-soft); font-size: .92rem; }
  li:first-child { border-top: 0; }
  .rank { width: 1.6rem; height: 1.6rem; border-radius: 50%; background: var(--brand-soft); color: var(--brand); font-size: .78rem; font-weight: 700; display: grid; place-items: center; }
  .r1 .rank { background: var(--gold); color: #fff; } .r2 .rank { background: var(--silver); color: #fff; } .r3 .rank { background: var(--bronze); color: #fff; }
  .who { min-width: 0; } .who .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .share { height: 5px; border-radius: 3px; background: var(--brand-soft); margin-top: .3rem; overflow: hidden; }
  .share > div { height: 100%; background: var(--brand); border-radius: 3px; }
  .zero { opacity: .45; }
  .value { font-weight: 700; color: var(--brand); font-variant-numeric: tabular-nums; }

  .bar { height: 12px; background: var(--brand-soft); border-radius: 6px; overflow: hidden; margin-top: .8rem; position: relative; }
  .bar > div { height: 100%; background: var(--accent); border-radius: 6px; }

  #error { max-width: 1150px; margin: 1rem auto; padding: 0 1rem; color: #b91c1c; }
  footer { text-align: center; color: var(--muted); font-size: .8rem; padding: 0 1rem 2rem; }

  @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
  @media (max-width: 640px) { .hero { grid-template-columns: 1fr; justify-items: center; text-align: center; } header h1 { font-size: 1.5rem; } }

  a.card-link { color: inherit; text-decoration: none; display: block; transition: transform .15s, box-shadow .15s; }
  a.card-link:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(33,43,70,.16); }
  .more { margin-top: 1rem; color: var(--accent); font-weight: 600; font-size: .85rem; }
  .back { color: #fff; opacity: .85; text-decoration: none; font-size: .9rem; display: inline-block; margin-bottom: .6rem; }
  .back:hover { opacity: 1; }
  .home-link { color: inherit; text-decoration: none; }
  .wide { grid-column: 1 / -1; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1.1rem; grid-column: 1 / -1; }
  .stat { background: var(--card); border-radius: 16px; padding: 1.1rem 1.3rem; box-shadow: 0 4px 18px rgba(33,43,70,.08); }
  .stat .k { color: var(--muted); font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; }
  .stat .v { font-size: 1.6rem; font-weight: 800; color: var(--brand); margin-top: .2rem; }
  .stat .s { color: var(--muted); font-size: .78rem; margin-top: .1rem; }
  svg.chart { width: 100%; height: auto; margin-top: .8rem; overflow: visible; }
  svg.chart text { font-size: 11px; fill: #6b7390; }
  table { width: 100%; border-collapse: collapse; margin-top: .8rem; font-size: .88rem; }
  th { text-align: left; color: var(--muted); font-weight: 600; font-size: .75rem; text-transform: uppercase; padding: .4rem .3rem; }
  td { padding: .5rem .3rem; border-top: 1px solid var(--brand-soft); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .tag { background: var(--brand-soft); color: var(--brand); border-radius: 6px; padding: .1rem .5rem; font-size: .75rem; }
  .empty { color: var(--muted); padding: 1rem 0; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a class="back" id="back" href="#/" hidden>← Overview</a>
    <h1><a class="home-link" href="#/" id="title">Strava <span>Challenge</span></a></h1>
    <div class="meta" id="meta"><span class="pill">Loading…</span></div>
  </div>
</header>
<div id="error"></div>
<main id="cards"></main>
<footer>Powered by Strava · data refreshes automatically</footer>

<script>
const ICONS = { group: '🏆', biking: '🚴', walking: '🥾', running: '🏃', fitness: '🏋️' };
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (n) => n.toLocaleString(undefined, { maximumFractionDigits: 1 });
const DAY = 86400000;

function periodInfo(p) {
  const start = Date.parse(p.start + 'T00:00:00Z');
  const end = Date.parse(p.end + 'T00:00:00Z') + DAY;
  const now = Date.now();
  const elapsed = Math.min(Math.max((now - start) / (end - start), 0), 1);
  return { elapsed, completed: now >= end, daysLeft: Math.max(Math.ceil((end - now) / DAY), 0) };
}

// Routes: #/  #/<quarter>  #/challenge/<id>  #/<quarter>/challenge/<id>   (quarter like 2026-Q3; omitted = current)
const parseRoute = () => {
  const m = /^#\/(?:(\d{4}-Q[1-4])\/?)?(?:challenge\/(.+))?$/.exec(location.hash);
  return { quarter: m?.[1], challenge: m?.[2] && decodeURIComponent(m[2]) };
};
let route = parseRoute();
const hashFor = (quarter, challengeId) =>
  '#/' + (quarter ? quarter + '/' : '') + (challengeId ? 'challenge/' + encodeURIComponent(challengeId) : '');
const qs = () => (route.quarter ? '?quarter=' + encodeURIComponent(route.quarter) : '');

const TOP_N = 3;
const expanded = new Set();
let overview = null;

function leaderboard(c) {
  const max = Math.max(...c.leaderboard.map((e) => e.total), 0);
  const open = expanded.has(c.id);
  const rows = open ? c.leaderboard : c.leaderboard.slice(0, TOP_N);
  const toggle = c.leaderboard.length > TOP_N
    ? `<button class="toggle" data-toggle="${esc(c.id)}">${open ? 'Show top ' + TOP_N : 'Show all ' + c.leaderboard.length}</button>` : '';
  return '<ol>' + rows.map((e, i) => `
    <li class="r${i + 1} ${e.total === 0 ? 'zero' : ''}">
      <span class="rank">${i + 1}</span>
      <div class="who"><div class="name">${esc(e.name)}</div>
        <div class="share"><div style="width:${max ? (e.total / max) * 100 : 0}%"></div></div></div>
      <span class="value">${fmt(e.total)} ${c.unit}</span>
    </li>`).join('') + '</ol>' + toggle;
}

function renderOverview() {
  const sorted = [...overview.challenges].sort((a, b) => !!b.goal - !!a.goal);
  $('cards').innerHTML = sorted.map((c) => (c.goal ? hero(c, overview.info) : card(c))).join('');
}

// Cards are links, so the toggle must not trigger navigation.
document.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-toggle]');
  if (!btn) return;
  e.preventDefault();
  e.stopPropagation();
  const id = btn.dataset.toggle;
  expanded.has(id) ? expanded.delete(id) : expanded.add(id);
  renderOverview();
});

function hero(c, info) {
  const pct = Math.round((c.progress ?? 0) * 100);
  const r = 80, circ = 2 * Math.PI * r, dash = circ * Math.min(c.progress ?? 0, 1);
  const onTrack = (c.progress ?? 0) >= info.elapsed;
  const status = !c.goal ? ''
    : info.completed
      ? `<span class="status ${(c.progress ?? 0) >= 1 ? 'ok' : 'behind'}">${(c.progress ?? 0) >= 1 ? '🏆 Goal reached' : 'Goal not reached'}</span>`
      : `<span class="status ${onTrack ? 'ok' : 'behind'}">${onTrack ? '✓ On track' : 'Behind schedule'} · ${Math.round(info.elapsed * 100)}% of time elapsed</span>`;
  return `<a class="card-link hero-link" href="${hashFor(route.quarter, c.id)}" style="grid-column:1/-1"><section class="card hero">
    <div class="ring">
      <svg width="190" height="190"><circle cx="95" cy="95" r="${r}" fill="none" stroke="#e9ecf4" stroke-width="16"/>
        <circle cx="95" cy="95" r="${r}" fill="none" stroke="#fc4c02" stroke-width="16" stroke-linecap="round" stroke-dasharray="${dash} ${circ}"/></svg>
      <div class="label"><span class="pct">${pct}%</span><span class="muted">of goal</span></div>
    </div>
    <div>
      <h2><span class="emoji">${ICONS[c.id] ?? '🏅'}</span>${esc(c.name)}</h2>
      <div class="big">${fmt(c.total)} <small>/ ${fmt(c.goal)} ${c.unit}</small></div>
      <div class="muted">${c.activityCount} activities · ${fmt(Math.max(c.goal - c.total, 0))} ${c.unit} to go${info.completed ? '' : ` · ${info.daysLeft} days left`}</div>
      ${status}
      ${leaderboard(c)}
      <div class="more">View details →</div>
    </div></section></a>`;
}

function card(c) {
  return `<a class="card-link" href="${hashFor(route.quarter, c.id)}"><section class="card" style="height:100%">
    <h2><span class="emoji">${ICONS[c.id] ?? '🏅'}</span>${esc(c.name)}</h2>
    <div class="total">${fmt(c.total)} <small>${c.unit}</small></div>
    <div class="muted">${c.activityCount} activities</div>${leaderboard(c)}
    <div class="more">View details →</div></section></a>`;
}

const $ = (id) => document.getElementById(id);

/** Renders title, quarter picker and meta pills from any API response that carries title/quarter/quarters. */
function setHeader(d, extra = '') {
  const info = periodInfo(d.period);
  const synced = d.lastSyncedAt ? new Date(d.lastSyncedAt).toLocaleString() : 'never';
  document.title = `${d.title} - ${d.quarter.label}`;
  $('title').innerHTML = `${esc(d.title)} <span>– ${esc(d.quarter.label)}</span>`;
  $('title').href = hashFor(route.quarter);
  $('back').href = hashFor(route.quarter);
  const options = d.quarters.map((q) =>
    `<option value="${q.id}" data-current="${q.current}" ${q.id === d.quarter.id ? 'selected' : ''}>${esc(q.label)}${q.current ? ' (current)' : ''}</option>`).join('');
  $('meta').innerHTML =
    `<select id="quarter" aria-label="Quarter">${options}</select>
     <span class="pill">📅 ${esc(d.period.start)} → ${esc(d.period.end)}</span>
     <span class="pill">${info.completed ? '🏁 Completed' : `⏳ ${info.daysLeft} days left`}</span>
     <span class="pill">🔄 Last sync: ${esc(synced)}</span>${extra}`;
  return info;
}

document.addEventListener('change', (e) => {
  if (e.target.id !== 'quarter') return;
  const q = e.target.selectedOptions[0].dataset.current === 'true' ? undefined : e.target.value;
  location.hash = hashFor(q, route.challenge);
});

// Served by the Node server (live API) or hosted statically (GitHub Pages: pre-exported JSON under data/).
// URLs are relative so the site also works below a sub-path like /repo-name/.
let staticMode = false;

async function getJson(url) {
  const res = await fetch(url);
  const body = await res.json();
  if (!res.ok) throw new Error(body.error ?? res.statusText);
  return body;
}

async function loadView(kind, id) {
  const q = route.quarter;
  const live = kind === 'dashboard' ? 'api/dashboard' + qs() : 'api/challenge/' + encodeURIComponent(id) + qs();
  const file = kind === 'dashboard'
    ? `data/dashboard/${q ?? 'current'}.json`
    : `data/challenge/${q ?? 'current'}/${encodeURIComponent(id)}.json`;
  if (!staticMode) {
    try { return await getJson(live); } catch (e) {
      // A static host answers the API path with an HTML 404, which fails JSON parsing.
      if (!(e instanceof SyntaxError)) throw e;
      staticMode = true;
    }
  }
  return getJson(file);
}

// ---- charts (dependency-free SVG) ----
function lineChart(weeks, unit, goal, projected) {
  if (!weeks.length) return '<div class="empty">No data yet.</div>';
  const W = 640, H = 220, L = 42, B = 28, T = 10, R = 12;
  const maxY = Math.max(goal ?? 0, projected ?? 0, ...weeks.map((w) => w.cumulative), 1);
  const x = (i) => L + (weeks.length === 1 ? 0 : (i / (weeks.length - 1)) * (W - L - R));
  const y = (v) => T + (1 - v / maxY) * (H - T - B);
  const pts = weeks.map((w, i) => `${x(i)},${y(w.cumulative)}`).join(' ');
  const grid = [0, .25, .5, .75, 1].map((f) => `<line x1="${L}" x2="${W - R}" y1="${y(maxY * f)}" y2="${y(maxY * f)}" stroke="#e9ecf4"/>
    <text x="${L - 6}" y="${y(maxY * f) + 4}" text-anchor="end">${fmt(maxY * f)}</text>`).join('');
  const labels = weeks.map((w, i) => (i % Math.ceil(weeks.length / 8) === 0 ? `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${w.weekStart.slice(5)}</text>` : '')).join('');
  const goalLine = goal ? `<line x1="${L}" x2="${W - R}" y1="${y(goal)}" y2="${y(goal)}" stroke="#fc4c02" stroke-dasharray="5 4"/>
    <text x="${W - R}" y="${y(goal) - 5}" text-anchor="end" style="fill:#fc4c02">goal ${fmt(goal)} ${unit}</text>` : '';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${grid}${goalLine}
    <polyline points="${pts}" fill="none" stroke="#212b46" stroke-width="3" stroke-linejoin="round"/>
    ${weeks.map((w, i) => `<circle cx="${x(i)}" cy="${y(w.cumulative)}" r="3.5" fill="#212b46"><title>Week of ${w.weekStart}: ${fmt(w.total)} ${unit} (total ${fmt(w.cumulative)})</title></circle>`).join('')}${labels}</svg>`;
}

function barChart(values, labels, unit, color = '#212b46') {
  const W = 640, H = 180, B = 24, T = 18, gap = 10;
  const max = Math.max(...values, 1), bw = (W - gap * (values.length + 1)) / values.length;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${values.map((v, i) => {
    const h = (v / max) * (H - B - T), bx = gap + i * (bw + gap);
    return `<rect x="${bx}" y="${H - B - h}" width="${bw}" height="${h}" rx="5" fill="${color}"><title>${labels[i]}: ${fmt(v)} ${unit}</title></rect>
      <text x="${bx + bw / 2}" y="${H - B - h - 5}" text-anchor="middle">${v ? fmt(v) : ''}</text>
      <text x="${bx + bw / 2}" y="${H - 7}" text-anchor="middle">${labels[i]}</text>`;
  }).join('')}</svg>`;
}

const stat = (k, v, s = '') => `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s}</div></div>`;
const fmtDate = (iso) => new Date(iso).toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
const fmtDuration = (h) => { const m = Math.round(h * 60); return m >= 60 ? `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, '0')}m` : `${m} min`; };

function detailView(d) {
  const s = d.summary, u = s.unit;
  const pace = d.projectedTotal === undefined ? '' :
    stat('Projected finish', `${fmt(d.projectedTotal)} ${u}`, d.projectedTotal >= s.goal ? 'on pace to reach the goal' : `${fmt(s.goal - d.projectedTotal)} ${u} short at this pace`);
  const maxSport = Math.max(...d.bySport.map((x) => x.total), 1);
  const sports = d.bySport.length ? '<ol>' + d.bySport.map((x) => `<li style="grid-template-columns:1fr auto"><div class="who"><div class="name">${esc(x.sportType)} <span class="muted">· ${x.count}×</span></div>
      <div class="share"><div style="width:${(x.total / maxSport) * 100}%"></div></div></div><span class="value">${fmt(x.total)} ${u}</span></li>`).join('') + '</ol>'
    : '<div class="empty">No activities yet.</div>';
  const members = `<table><tr><th>#</th><th>Member</th><th class="num">Total</th><th class="num">Activities</th><th class="num">Active days</th><th class="num">Best single</th></tr>${d.members.map((m, i) =>
    `<tr class="${m.total === 0 ? 'zero' : ''}"><td>${i + 1}</td><td>${esc(m.name)}</td><td class="num"><strong>${fmt(m.total)} ${u}</strong></td><td class="num">${m.count}</td><td class="num">${m.activeDays}</td><td class="num">${fmt(m.best)} ${u}</td></tr>`).join('')}</table>`;
  const fmtPace = (p) => p.unit === 'min/km'
    ? `${Math.floor(p.value)}:${String(Math.round((p.value % 1) * 60)).padStart(2, '0')} /km` : `${fmt(p.value)} km/h`;
  const recent = d.recent.length ? `<table><tr><th>Date</th><th>Member</th><th>Activity</th><th class="num">Time</th><th class="num">Distance</th><th class="num">Pace</th><th class="num">Avg HR</th></tr>${d.recent.map((a) =>
    `<tr><td>${fmtDate(a.date)}</td><td>${esc(a.member)}</td><td>${esc(a.name)} <span class="tag">${esc(a.sportType)}</span></td><td class="num">${fmtDuration(a.hours)}</td><td class="num">${a.hasDistance ? fmt(a.km) + ' km' : '–'}</td><td class="num">${a.pace ? fmtPace(a.pace) : '–'}</td><td class="num">${a.averageHeartrate ? a.averageHeartrate + ' bpm' : '–'}</td></tr>`).join('')}</table>`
    : '<div class="empty">No activities yet.</div>';
  const biggest = d.biggest ? stat('Biggest activity', `${fmt(d.biggest.value)} ${u}`, `${esc(d.biggest.member)} · ${fmtDate(d.biggest.date)}`) : stat('Biggest activity', '–');
  const pct = s.progress === undefined ? '' : stat('Progress', `${Math.round(s.progress * 100)}%`, `${fmt(s.total)} of ${fmt(s.goal)} ${u}`);

  return `<div class="stats">
      ${stat('Total', `${fmt(s.total)} ${u}`, `${s.activityCount} activities`)}${pct}${pace}
      ${stat('Active days', d.activeDays, 'days with at least one activity')}
      ${stat('Average', `${fmt(d.avgPerActivity)} ${u}`, 'per activity')}${biggest}</div>
    <section class="card wide"><h2>📈 Progress per week</h2><div class="muted">Cumulative ${u}${s.goal ? ' vs. goal' : ''}</div>${lineChart(d.weekly, u, s.goal, undefined)}</section>
    <section class="card"><h2>🗓️ Busiest weekday</h2>${barChart(d.weekdays, ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'], u, '#fc4c02')}</section>
    <section class="card"><h2>🏷️ By sport</h2>${sports}</section>
    <section class="card wide"><h2>👥 Members</h2>${members}</section>
    <section class="card wide"><h2>🕒 Latest activities</h2>${recent}</section>`;
}

async function showOverview() {
  $('back').hidden = true;
  const d = await loadView('dashboard');
  overview = { challenges: d.challenges, info: setHeader(d) };
  renderOverview();
}

async function showChallenge(id) {
  $('back').hidden = false;
  const d = await loadView('challenge', id);
  setHeader(d, `<span class="pill">${ICONS[id] ?? '🏅'} ${esc(d.summary.name)}</span>`);
  $('cards').innerHTML = detailView(d);
}

async function render() {
  try {
    route = parseRoute();
    await (route.challenge ? showChallenge(route.challenge) : showOverview());
    $('error').textContent = '';
  } catch (e) {
    $('error').textContent = 'Failed to load: ' + e.message;
  }
}
window.addEventListener('hashchange', () => { window.scrollTo(0, 0); render(); });
render();
setInterval(render, 5 * 60 * 1000);
</script>
</body>
</html>
